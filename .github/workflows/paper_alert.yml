name: Daily Paper Alert

on:
  schedule:
    # 매일 01:00 UTC = 한국시간(KST) 매일 10:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 추가 (테스트용)

permissions:
  contents: write

jobs:
  send-paper-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run paper bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python paper_bot.py

      - name: Commit paper log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/paper_log.json ] && git add data/paper_log.json
          git diff --cached --quiet || git commit -m "Log today's posted papers"
          git push
