name: Weekly Paper Alert

on:
  schedule:
    # 매주 월요일 01:00 UTC = 한국시간(KST) 월요일 10:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}  # 수동 실행 버튼도 추가 (테스트용)

jobs:
  send-paper-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run paper bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python paper_bot.py
